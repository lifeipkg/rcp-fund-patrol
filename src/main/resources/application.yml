server:
  port: 8084

spring:
  application:
    name: fund-patrol
  cloud:
    nacos:
      discovery:
        # 服务发现接线（rcp-contracts/docs/DISCOVERY.md）：占位符默认值命中部署侧
        # Service 名（compose 服务名与 K8s Service 名均为 nacos），部署侧无需注入。
        server-addr: ${NACOS_SERVER:nacos:8848}
        namespace: ${NACOS_NAMESPACE:risk-control}
        group: ${NACOS_GROUP:DEFAULT_GROUP}

patrol:
  fund:
    # 同银行卡关联账号达到该值 -> BAN（团伙信号）
    bankcard-gang-count: 3
    # 同设备账号达到该值 且 金额达到该值 -> INTERCEPT
    device-gang-count: 3
    device-gang-amount: 500
    # 账号年龄 <= 该天数 且 金额达到该值 -> EXTRA_REVIEW（放款前分层）
    new-account-days: 3
    new-account-amount: 200
    # 24h 申请次数达到该值 -> LIMIT
    apply-limit-count: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
